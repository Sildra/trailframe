name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  Release:
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/trailframe/

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      #
      # Frontend
      #
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      #
      # Python
      #
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz

  Notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify hassio-trailframe
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.HASSIO_REPO_TOKEN }}
          repository: Sildra/hassio-trailframe
          event-type: trailframe-release
          client-payload: |
            {
              "version": "${{ github.ref_name }}"
            }
