name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      #
      # Frontend
      #
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      #
      # Python
      #
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Upload distribution
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  Test:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      #
      # Backend
      #
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Download distribution
        uses: actions/download-artifact@v8
        with:
          name: dist

      - name: Smoke-test wheel
        run: |
          pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP" && python -c "from importlib.resources import files; package = files('trailframe'); assert (package / 'frontend' / 'dist' / 'index.html').is_file(), 'frontend/dist missing from wheel'; print('wheel contains the bundled frontend')"

      - name: Test
        run: python -m pytest

      #
      # Frontend
      #
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

  Release:
    runs-on: ubuntu-latest
    needs: Test

    environment:
      name: pypi
      url: https://pypi.org/project/trailframe/

    steps:
      - name: Download distribution
        uses: actions/download-artifact@v8
        with:
          name: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz

  Notify:
    runs-on: ubuntu-latest
    needs: Release
    steps:
      - name: Notify hassio-trailframe
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.HASSIO_REPO_TOKEN }}
          repository: Sildra/hassio-trailframe
          event-type: trailframe-release
          client-payload: |
            {
              "version": "${{ github.ref_name }}"
            }