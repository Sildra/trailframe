[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ha-gallery"
version = "0.1.0"
description = "Photo gallery app with FastAPI backend and React frontend"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pyyaml",
    "pillow",
    "sqlmodel",
    "sqlalchemy[asyncio]",
    "aiosqlite",
    "requests",
    "shapely",
    "numpy",
    "s2sphere",
    "py-staticmaps",
    "garminconnect",
    "ultralytics",
    "opencv-python",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "openapi-typescript",
]

[project.scripts]
gallery = "gallery.main:main"

[tool.hatch.build.targets.wheel]
packages = ["gallery"]

[tool.hatch.build.force-include]
"../frontend/dist" = "gallery/frontend/dist"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
split-on-trailing-comma = false
