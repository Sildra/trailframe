[build-system]
requires = [
    "hatchling",
    "hatch-vcs"
]
build-backend = "hatchling.build"

[project]
name = "trailframe"
dynamic = ["version"]
authors = [
    { name="Thibaut Fresnet", email="sildra.fr@gmail.com" },
]
description = "Photo gallery app with FastAPI backend and React frontend"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3"
]
dependencies = [
    "fastapi",
    "imagehash",
    "python-multipart",
    "uvicorn",
    "pyyaml",
    "pillow",
    "sqlmodel",
    "sqlalchemy[asyncio]",
    "aiosqlite",
    "requests",
    "shapely",
    "numpy",
    "s2sphere",
    "py-staticmaps",
    "garminconnect",
    "ultralytics",
    "opencv-python",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "openapi-typescript",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
    "allure-pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--alluredir=allure-results --clean-alluredir --cov=trailframe --cov-report=term"

[tool.coverage.run]
branch = true
source = ["trailframe"]

[project.scripts]
trailframe = "trailframe.main:main"

[project.urls]
Homepage = "https://github.com/Sildra/Trailframe"
Issues = "https://github.com/Sildra/Trailframe/issues"

[tool.hatch.build.hooks.vcs]
version-file = "trailframe/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["trailframe"]
artifacts = ["trailframe/frontend/dist"]

[tool.hatch.build.targets.wheel.force-include]
"frontend/dist" = "trailframe/frontend/dist"

[tool.hatch.build.targets.sdist]
artifacts = ["frontend/dist"]

[tool.hatch.version]
source = "vcs"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
ignore = ["DTZ001", "DTZ005", "DTZ006", "DTZ007"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false
